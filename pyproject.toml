[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-build-optimizer"
version = "0.1.0"
description = "Excel-driven PC build optimiser for AI, animation, gaming and value-focused builds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "PyYAML>=6.0",
  "ortools>=9.10,<9.12",
  "numpy>=1.26,<2",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
pc-optimizer = "pc_optimizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
